# Template: replace ems.example.org and certificate paths before installation.
map $uri $ems_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/ "no-store";
}
server {
    listen 80;
    server_name ems.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ems.example.org;
    ssl_certificate /etc/letsencrypt/live/ems.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ems.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/ntech-ems/frontend/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $ems_cache_control always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sw.js { try_files $uri =404; }
    location = /manifest.webmanifest { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
